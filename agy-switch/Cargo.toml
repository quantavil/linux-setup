[package]
name = "agy-switch"
version = "2.0.0"
edition = "2024"
rust-version = "1.87"
description = "Recoverable Antigravity CLI account switching"
license = "MIT"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
secret-service = { version = "5.2", features = ["rt-async-io-crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
tempfile = "3"
ctrlc = "3"
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[profile.release]
lto = "thin"
strip = true
